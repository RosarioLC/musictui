[project]
name = "musictui"
version = "0.1.0"
description = "A terminal-based music player with synced lyrics and ANSI half-block colour art"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "RosarioLC"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
]

dependencies = [
    "textual>=0.40,<1.0",
    "python-vlc",
    "numpy",
    "Pillow",
    "ytmusicapi",
    "syncedlyrics",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
musictui = "main:main"

[tool.setuptools.packages.find]
include = ["catalog", "model", "playback", "services", "store", "ui", "tests"]

[tool.setuptools.package-data]
"*" = ["*.tcss"]
